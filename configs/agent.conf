<!--
  Centralized agent configuration for the "default" agent group.
  Install on the Wazuh server at: /var/ossec/etc/shared/default/agent.conf
  Validate with: sudo /var/ossec/bin/verify-agent-conf
-->

<agent_config os="Windows">

  <!-- Sysmon: process creation, network connections, file creation, etc. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell Operational: Script Block Logging (Event ID 4104) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
